<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>PayPal - Claim Gift Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #f4f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .gift-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            max-width: 420px;
            width: 90%;
            padding: 40px 30px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #e1e8ed;
        }
        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background-color: #0070ba;
            border-radius: 50%;
            margin-bottom: 24px;
        }
        .icon-container svg {
            width: 35px;
            height: 35px;
            fill: #ffffff;
        }
        h1 {
            color: #0b1a30;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }
        .badge-fiktif {
            display: inline-block;
            background-color: #e5f1fa;
            color: #0070ba;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .card-details {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .amount-tag {
            font-size: 36px;
            font-weight: 800;
            color: #0070ba;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }
        .claim-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #0070ba;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(0, 112, 186, 0.2);
        }
        .claim-btn:hover {
            background-color: #005ea6;
        }
        .claim-btn:active {
            transform: scale(0.98);
        }
        .transaction-id {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="gift-container">
        <div class="icon-container">
          <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" height="45">
        </div>
        
        <h1>PayPal</h1>
        <div class="badge-fiktif">Gift Card</div>
        
        <div class="card-details">
            <div class="amount-tag">$ 25.00</div>
            <p class="status-text">
                The electronic gift voucher is ready to be redeemed. The balance will be credited to your digital account once the verification process is complete.
            </p>
        </div>
        
        <button class="claim-btn" onclick="alert('Muach Love You!')">
            Claim Your Reward
        </button>
        
        <div class="transaction-id">
            ID: PP-ID8728932873
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
